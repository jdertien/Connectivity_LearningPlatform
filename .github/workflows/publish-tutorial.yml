# Place this file at the ROOT of the EBV_resources repo, at:
#   .github/workflows/publish-tutorial.yml
# GitHub only reads workflow files from .github/workflows/ at the repo root,
# even though this workflow only builds the tutorial/ subfolder.

name: Publish Connectivity Turotial

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/publish-tutorial.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.5.56"
          
      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
